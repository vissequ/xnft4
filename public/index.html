<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>xNFT</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script type="module" src="script.js" defer></script>
</head>
<body>
    <h1>xNFT</h1>

    <button id="connectWallet">Connect Wallet</button>
    <p id="walletInfo">Wallet not connected</p>

    <form id="tweetForm">
        <input type="text" id="tweetUrl" placeholder="Enter Post URL" required />
        <button type="submit">Generate xNFT</button>
    </form>

    <p id="message"></p>

    <div id="please-wait" style="display: none;">
        <div class="overlay"></div>
        <div class="modal">
            <p>Please wait... Transaction is processing</p>
        </div>
    </div>
    
    
    <div id="result">
        <a id="download-button" style="display: none;" download="generated.gif">Download GIF</a>
        <button id="mintButton" style="display: none;">Mint xNFT</button>
        <button id="updateBaseURIButton" style="display: none;">Update Base URI</button>
        <img id="gif-display" alt="Generated GIF" style="display: none; max-width: 100%;" />
        <div id="media-container" style="display:none;"></div>
    </div>
</body>
</html>
